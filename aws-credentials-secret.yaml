---
# This Secret should be created with actual credentials using kubectl
# DO NOT commit real credentials to version control
# 
# To create this secret with actual credentials, use:
# kubectl create secret generic aws-credentials \
#   --from-literal=aws-access-key-id=YOUR_ACCESS_KEY_ID \
#   --from-literal=aws-secret-access-key=YOUR_SECRET_ACCESS_KEY \
#   -n insecure-app
#
# kubectl create secret generic aws-credentials \
#   --from-literal=aws-access-key-id=YOUR_ACCESS_KEY_ID \
#   --from-literal=aws-secret-access-key=YOUR_SECRET_ACCESS_KEY \
#   -n workload-security-evaluator
#
# Alternatively, consider using:
# - AWS IAM Roles for Service Accounts (IRSA) for EKS
# - Workload Identity for GKE
# - External Secrets Operator with AWS Secrets Manager
# - Vault or other secret management solutions
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: insecure-app
type: Opaque
stringData:
  aws-access-key-id: "REPLACE_WITH_ACTUAL_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_ACTUAL_SECRET_ACCESS_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: workload-security-evaluator
type: Opaque
stringData:
  aws-access-key-id: "REPLACE_WITH_ACTUAL_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_ACTUAL_SECRET_ACCESS_KEY"
